<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire Survivor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Vampire Survivors Clone</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info">
            <p>Use Arrow Keys to move! Auto-shoots the nearest enemy!</p>
            <p>Red = You | Green = Enemies | Yellow = Your Shots</p>
            <p>Survive as long as you can and increase your score! 🧛</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
